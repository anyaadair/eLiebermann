---
title: Statutes of the Realm viewer
full_width: true
---
<div class="sv-viewer">
    <aside class="sv-sidebar">
        <nav class="sv-volumes" aria-label="Volumes">
            <span class="facet-title">Volume</span>
            <div id="volLinks"></div>
        </nav>
        <div class="sv-heading">
            <h1>Statutes of the Realm</h1>
            <p id="volLabel" class="small muted"></p>
        </div>
        <div class="sv-commentary" id="commentaryTarget">
            <p class="muted">Choose an annotated page below to read its commentary beside the scan.</p>
        </div>
        <div class="sv-pages">
            <strong>Annotated pages</strong>
            <div id="jumpLinks"></div>
        </div>
    </aside>
    <div class="sv-scan">
        <iframe id="archiveFrame" title="Scan of the volume on archive.org" allowfullscreen></iframe>
    </div>
</div>

<style>
    .sv-viewer { display: flex; height: calc(100vh - 12rem); min-height: 32rem; border-top: 1px solid var(--rule); }
    .sv-sidebar { width: 26rem; max-width: 45%; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--rule); }
    .sv-volumes { padding: 0.75rem 1rem; border-bottom: 1px solid var(--rule); background: #f3f1ec; }
    .sv-volumes #volLinks { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .sv-volumes a { font-size: 0.85rem; padding: 0.1rem 0.45rem; border-radius: 4px; text-decoration: none; }
    .sv-volumes a[aria-current] { background: var(--navy); color: #fff; font-weight: 600; }
    .sv-heading { padding: 0.75rem 1rem 0; }
    .sv-heading h1 { font-size: 1.4rem; margin: 0; }
    .sv-commentary { flex: 1; overflow-y: auto; padding: 0.5rem 1rem; }
    .sv-pages { padding: 0.75rem 1rem; border-top: 1px solid var(--rule); background: #f3f1ec; }
    .sv-pages #jumpLinks { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
    .sv-pages button { padding: 0.2rem 0.6rem; font-size: 0.85rem; }
    .sv-scan { flex: 1; padding: 0.75rem; background: #2b2b2b; }
    .sv-scan iframe { width: 100%; height: 100%; border: 0; border-radius: 4px; background: #fff; }
    @media (max-width: 50rem) {
        .sv-viewer { flex-direction: column; height: auto; }
        .sv-sidebar { width: auto; max-width: none; }
        .sv-scan { height: 70vh; }
    }
</style>

<script>
    // Volumes come from _data/statutes_volumes.yml; the commentary pages in
    // each volume's folder are listed when the site is built.
    const VOLUMES = [
    {%- for vol in site.data.statutes_volumes %}
        {%- assign prefix = "/" | append: vol.folder | append: "/" %}
        {%- assign files = site.static_files | where_exp: "f", "f.path contains prefix" | where: "extname", ".html" %}
        { key: {{ vol.key | jsonify }}, short: {{ vol.short | jsonify }}, name: {{ vol.name | jsonify }}, archive: {{ vol.archive | jsonify }}, folder: {{ vol.folder | jsonify }},
          pages: [{% for f in files %}{{ f.basename | jsonify }}{% unless forloop.last %},{% endunless %}{% endfor %}] }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
    ];
    const root = window.SITE_ROOT || '';
    const params = new URLSearchParams(location.search);
    const current = VOLUMES.find(v => v.key === params.get('v')) || VOLUMES[0];
    const frame = document.getElementById('archiveFrame');
    const display = document.getElementById('commentaryTarget');

    document.getElementById('volLabel').textContent = current.name;
    frame.src = `https://archive.org/embed/${current.archive}#mode/1up/page/n1`;
    document.getElementById('volLinks').innerHTML = VOLUMES.map(v =>
        `<a href="?v=${v.key}"${v === current ? ' aria-current="page"' : ''} title="${v.name}">${v.short}</a>`).join('');

    const pages = current.pages.map(p => parseInt(p, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
    const jump = document.getElementById('jumpLinks');
    if (!pages.length) {
        jump.innerHTML = '<span class="small muted">No commentary for this volume yet.</span>';
    } else {
        pages.forEach(page => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'secondary';
            btn.textContent = `p. ${page}`;
            btn.onclick = () => goToPage(page);
            jump.appendChild(btn);
        });
    }

    async function goToPage(page) {
        frame.src = `https://archive.org/embed/${current.archive}#mode/1up/page/n${page - 1}`;
        display.innerHTML = `<p class="loading">Loading page ${page}…</p>`;
        try {
            const res = await fetch(`${root}${current.folder}/${page}.html`);
            if (!res.ok) throw new Error();
            // Commentary files may be whole HTML documents; show just their body.
            const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
            display.innerHTML = `<p class="facet-title">Page ${page}</p>${doc.body.innerHTML}`;
        } catch (err) {
            display.innerHTML = `<p class="muted">No commentary found for page ${page}.</p>`;
        }
    }
</script>
