---
title: Law code
section: laws
description: One law code of pre-Conquest England, clause by clause, with its text and an English translation.
scripts:
  - "ROOT/scripts/eliebermann.js"
---
<article id="code"><p class="loading">Loading the law code…</p></article>

<script>
(function () {
    const root = window.SITE_ROOT || '';
    const target = document.getElementById('code');
    const wanted = new URLSearchParams(location.search).get('code') || '';
    const esc = ELieb.escapeXml;
    const clauseUrl = id => root + 'law.html?id=' + encodeURIComponent(id);
    const codeUrl = code => root + 'lawcode.html?code=' + encodeURIComponent(code);
    const fold = s => ELieb.slugify(s).toLowerCase().replace(/-/g, '');

    function render(code, codes, clauses) {
        const i = codes.indexOf(code);
        const mine = clauses.filter(c => c.code === code.code);
        document.title = code.name + ' · eLiebermann';
        const lawAbb = code.anchor ? `<a href="${root}lawAbb.html#${encodeURIComponent(code.anchor)}" title="On the list of law codes and manuscripts">${esc(code.code)}</a>` : esc(code.code);
        const bits = [
            `<span class="code-abbr">${lawAbb}</span>`,
            code.reign ? esc(code.reign.replace(/^\[|\]$/g, '')) : ''
        ].filter(Boolean);
        // "Suggested dates: 601–4 (Liebermann) · 597–616, perhaps 602–3 (Whitelock) · …": Liebermann's first, then the
        // others in order of publication (as the database gives them); then the places, as on the clause pages.
        const who = names => names.length ? ' (' + names.map(esc).join(names.some(n => n.includes(',')) ? '; ' : ', ') + ')' : '';   // "Wormald, MEL p. 337" carries its page
        const dateLine = (label, items) => items && items.length ? `<p><span class="clause-dates__label">${label}: </span>${
            items.map(([text, names]) => esc(text) + who(names))
                .join('<span class="clause-dates__sep"> · </span>')}</p>` : '';
        const dates = code.dates ? dateLine('Suggested dates', code.dates) + dateLine('Place', code.places)
            : (code.date ? `<p><span class="clause-dates__label">Suggested dates: </span>${esc(code.date)}</p>` : '');
        // Manuscripts, editions and the number of clauses go under the dates, in the same "Label: …" style.
        const plainLine = (label, html) => `<p><span class="clause-dates__label">${label}: </span>${html}</p>`;
        const sources = ['Liebermann'].concat(code.editors || []);
        // Column headings name the source most of this code's clauses use;
        // a clause from another source carries its own small label.
        const commonest = key => {
            const n = {};
            mine.forEach(c => { if (c[key]) n[c[key]] = (n[c[key]] || 0) + 1; });
            return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || '';
        };
        const textLabel = commonest('oeLabel'), enLabel = commonest('glossLabel');
        const lang = commonest('oeLang');
        const textHead = (lang === 'la' ? 'Latin' : lang === 'ang' ? 'Old English' : lang === 'xno' ? 'Anglo-Norman French' : 'Text') + (textLabel ? ': ' + textLabel : '');
        // A Latin text Liebermann prints without a German translation has no English crib.
        const enHead = mine.some(c => c.gloss) ? 'English' + (enLabel ? ': ' + enLabel : '')
            : 'English: none (Liebermann gives no German translation of this text)';
        // Brief: just "MS B" when the editor is the same as the heading's.
        const tag = (label, usual) => {
            if (!label || label === usual) return '';
            const ed = usual.split(',')[0];
            const short = label.startsWith(ed + ', ') ? label.slice(ed.length + 2) : label;
            return `<span class="code-clause-src">${esc(short)}</span> `;
        };
        target.innerHTML = `
            <p class="breadcrumb small"><a href="${root}laws.html">Laws</a> › ${esc(code.group)}</p>
            <header class="entry-header">
                <h1>${esc(code.name)}</h1>
                <div class="meta">${bits.map(b => `<span>${b}</span>`).join('')}</div>
                <div class="clause-dates">${dates}${
                    code.manuscripts && code.manuscripts.length ? plainLine('Manuscripts', code.manuscripts.map(esc).join(', ')) : ''}${
                    plainLine('Editions and translations', sources.map(esc).join(', '))}${
                    plainLine('Clauses', String(mine.length))}</div>
            </header>
            <p class="code-callout">Below is the code in summary form: one text (the first in Liebermann’s edition) and one translation (an English crib of Liebermann’s German). Where either of these is unavailable, an alternative is shown and labelled. Each clause has its own page with all its texts, manuscripts, editions and translations, and its notes, cross-references and keywords. Click a clause number, or <em>All texts and translations</em> under any clause, to open it.</p>
            <div class="code-tools">
                <input type="search" id="find" placeholder="Find in this law code (clause number or words)" aria-label="Find in this law code">
                <a class="button" href="${mine.length ? clauseUrl(mine[0].id) + '&all=1' : '#'}">Read with every text and translation</a>
            </div>
            <div class="code-clauses-head">
                <span></span>
                <span>${esc(textHead)}</span>
                <span>${esc(enHead)}</span>
            </div>
            <ol class="code-clauses" id="clauses"></ol>
            <nav class="clause-nav">
                ${i > 0 ? `<a href="${codeUrl(codes[i - 1].code)}">← ${esc(codes[i - 1].name)}</a>` : '<span></span>'}
                ${i < codes.length - 1 ? `<a href="${codeUrl(codes[i + 1].code)}">${esc(codes[i + 1].name)} →</a>` : '<span></span>'}
            </nav>`;
        const ol = document.getElementById('clauses');
        const draw = term => {
            const t = fold(term || '');
            const shown = !t ? mine : mine.filter(c => fold(c.clause).startsWith(t) || fold(c.oe + ' ' + c.gloss + ' ' + c.en).includes(t));
            ol.innerHTML = shown.length ? shown.map(c => `
                <li id="${esc(c.id)}">
                    <a class="code-clause-no" href="${clauseUrl(c.id)}" title="All texts, manuscripts and translations of ${esc(c.citation)}">${esc(c.clause || c.citation)}</a>
                    <p class="code-clause-oe">${tag(c.oeLabel, textLabel)}${esc(c.oe)}</p>
                    <p class="code-clause-en">${tag(c.glossLabel, enLabel)}${esc(c.gloss)}</p>
                    <a class="code-clause-more" href="${clauseUrl(c.id)}">All texts and translations<span aria-hidden="true"> ›</span><span class="visually-hidden"> of ${esc(c.citation)}</span></a>
                </li>`).join('') : '<li class="muted">Nothing in this law code matches.</li>';
        };
        draw('');
        document.getElementById('find').addEventListener('input', e => draw(e.target.value.trim()));
        if (location.hash) { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) el.scrollIntoView(); }
    }

    Promise.all([
        fetch(root + 'oe-laws/codes.json').then(r => r.json()),
        fetch(root + 'data/laws.json').then(r => r.json())
    ]).then(([codes, clauses]) => {
        codes = codes.filter(c => clauses.some(x => x.code === c.code));
        const code = codes.find(c => c.code === wanted) || codes.find(c => fold(c.code) === fold(wanted));
        if (!code) throw new Error('missing');
        render(code, codes, clauses);
    }).catch(() => {
        target.innerHTML = `<h1>Law code not found</h1><p>There is no law code “${esc(wanted)}” in the database. <a href="${root}laws.html">See the list of law codes.</a></p>`;
    });
})();
</script>
